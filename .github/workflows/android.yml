# Sémaphore — compilation automatique de l'APK Android
#
# Déclencheurs :
#   - chaque push et chaque pull request  → APK de test (debug), téléchargeable dans l'onglet Actions
#   - bouton « Run workflow » (manuel)     → idem
#   - tag « v* » (ex. v1.0.0)              → en plus, une Release GitHub avec les APK attachés
#
# APK signé (release) : facultatif. Il est produit seulement si ces 4 secrets existent
# (Settings › Secrets and variables › Actions) :
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD

name: Android

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compiler l'APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurer Gradle (avec cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Accepter les licences du SDK Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Rendre gradlew exécutable
        run: chmod +x gradlew

      - name: Compiler l'APK de test (debug)
        run: ./gradlew assembleDebug --stacktrace

      - name: Préparer la clé de signature
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/semaphore.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/semaphore.jks" >> "$GITHUB_ENV"

      - name: Compiler l'APK signé (release)
        if: env.HAS_KEYSTORE == 'true'
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Renommer les APK
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME//\//-}"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/Semaphore-${VERSION}-debug.apk"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/Semaphore-${VERSION}.apk"
          fi
          ls -la dist

      - name: Publier les APK (artefact)
        uses: actions/upload-artifact@v4
        with:
          name: Semaphore-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Créer la Release GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
