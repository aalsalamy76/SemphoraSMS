# Sémaphore — compilation automatique de l'APK Android
# Fonctionne avec le projet décompressé OU avec seulement « Semaphore-SMS.zip » dans le dépôt.
# APK signé (facultatif) : secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD

name: Android

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compiler l'APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v6

      - name: Trouver (ou décompresser) le projet
        run: |
          if [ -f gradlew ]; then
            DIR="."
          else
            ZIP=$(ls *.zip 2>/dev/null | head -n 1)
            if [ -n "$ZIP" ]; then
              echo "Décompression de $ZIP"
              unzip -q -o "$ZIP" -d _projet
            fi
            DIR=$(find . -path ./.git -prune -o -name gradlew -type f -print | head -n 1 | xargs -r dirname)
          fi
          if [ -z "$DIR" ] || [ ! -f "$DIR/gradlew" ]; then
            echo "::error::Projet introuvable : ni gradlew ni zip du projet dans le dépôt."
            ls -la
            exit 1
          fi
          echo "Projet trouvé dans : $DIR"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          chmod +x "$DIR/gradlew"

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurer Gradle (avec cache)
        uses: gradle/actions/setup-gradle@v5

      - name: Accepter les licences du SDK Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Compiler l'APK de test (debug)
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Préparer la clé de signature
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/semaphore.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/semaphore.jks" >> "$GITHUB_ENV"

      - name: Compiler l'APK signé (release)
        if: env.HAS_KEYSTORE == 'true'
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Renommer les APK
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME//\//-}"
          OUT="$PROJECT_DIR/app/build/outputs/apk"
          cp "$OUT/debug/app-debug.apk" "dist/Semaphore-${VERSION}-debug.apk"
          if [ -f "$OUT/release/app-release.apk" ]; then
            cp "$OUT/release/app-release.apk" "dist/Semaphore-${VERSION}.apk"
          fi
          ls -la dist

      - name: Publier les APK (artefact)
        uses: actions/upload-artifact@v6
        with:
          name: Semaphore-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Créer la Release GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.apk
          generate_release_notes: true
